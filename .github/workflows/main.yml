name: Stashmatic CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-api:
    name: Run Pytest (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./prod.db # Satisfies pydantic-settings
          TEST_DATABASE_URL: sqlite:///./test.db # Used by conftest.py
          CLERK_SECRET_KEY: test_sk_123 # Dummy key for tests
          PYTHONPATH: ..
        run: |
          pytest

  deploy-api:
    name: Deploy API to Fly.io
    needs: test-api
    runs-on: ubuntu-latest
    # Only deploy on pushes to master, not on PRs
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./api
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
